apiVersion: v1
kind: Service
metadata:
  name: qwen-burst-svc
  labels:
    app: vllm-burst-scaling
    # 05-servicemonitor selects Services by this label. Without it Prometheus
    # never scrapes vLLM, the KEDA triggers read nothing and the burst never fires.
    model: qwen25-1-5b
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  # Round-robin across BOTH tiers (baseline on-prem CPU + burst cloud GPU).
  # Selects on the shared app label so requests load-balance over hybrid and
  # burst pods transparently.
  selector:
    app: vllm-burst-scaling
