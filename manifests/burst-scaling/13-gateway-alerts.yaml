apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hybrid-gateway-alerts
  namespace: monitoring
spec:
  groups:
    - name: hybrid-gateway
      rules:
        - alert: HybridGatewayLeaderLost
          expr: sum(hybrid_gateway_leader_is_active) == 0
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "No active Hybrid Nodes Gateway leader"
        - alert: HybridGatewayRouteUpdateFailed
          expr: increase(hybrid_gateway_aws_route_table_update_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Gateway failed to update VPC route table"
        - alert: HybridPodScrapeFailure
          expr: up{job="vllm-hybrid"} == 0
          for: 45s
          labels:
            severity: warning
          annotations:
            summary: "Cannot scrape hybrid pod metrics via pod IP"
