apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hybrid-pod-policy
  labels:
    app: vllm-burst-scaling
spec:
  podSelector:
    matchLabels:
      app: vllm-burst-scaling
      tier: hybrid
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vllm-burst-scaling
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 8472
          protocol: UDP
