affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: eks.amazonaws.com/compute-type
          operator: In
          values:
          - hybrid

tolerations:
- key: nvidia.com/gpu
  operator: Exists
  effect: NoSchedule

serviceMonitor:
  enabled: false

service:
  type: ClusterIP
  port: 9400
